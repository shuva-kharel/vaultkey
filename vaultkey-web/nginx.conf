server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Remove the API proxy since the React app calls the API directly
    # The React app already has REACT_APP_API_URL=http://localhost:8000
}