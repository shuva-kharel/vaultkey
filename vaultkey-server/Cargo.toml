[package]
name = "vaultkey-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { version = "4", features = ["macros", "rustls"] }
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
webauthn-rs = "0.5"
webauthn-rs-core = "0.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
url = "2"
toml = "0.8"